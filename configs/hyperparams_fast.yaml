# ============================================================================
#  configs/hyperparams_fast.yaml -- A PLUMBING TEST SET. NOT A MODEL.
# ============================================================================
#
# WHAT IT IS FOR
#   proving the pipeline end to end in minutes instead of hours: build -> publish -> train ->
#   scored table -> backtest -> SHAP -> deepchecks. it answers "does every hand fire and does
#   every artifact land", never "is this model any good".
#
# HOW TO USE IT -- do NOT edit configs/hyperparams.yaml for a speed test.
#   export NIFTY_HPARAMS=configs/hyperparams_fast.yaml
#   ...run publish_version.py...
#   the env var is read on the CONTROLLER, where publish resolves the numbers and bakes them into
#   Args/* on the cloned task. the agent needs nothing; it just gets small numbers.
#
# WHY THE NUMBERS LOOK WRONG (they are, on purpose)
#   h8 is loss-based with depth/leaves opened as far as the library allows and NO early stopping,
#   so all 6,000 trees are always built: ~1.7 h for catboost, similar for xgboost. that is the
#   right shape for a real run and the wrong shape for a smoke test.
#
#   everything below is inverted:
#     n_estimators  6000 -> 120   a count, and now a small one
#     learning_rate 0.02 -> 0.3   few trees can only move if each step is big
#     capacity      uncapped -> 31 leaves / depth 6
#     early stop    off -> 15     so it exits the moment val stops improving
#
#   THE RESULTING MODEL WILL BE POOR. that is expected and is not a finding. read the run for
#   "did the table, the backtest CSVs, the SHAP and the deepchecks report all appear", and read
#   NOTHING into the metrics.
#
# THE KEY SET IS IDENTICAL TO h8's, deliberately. merge() only honours an override whose key
# exists in the default block, and build_model() forwards a fixed key set -- so a key dropped
# here would silently fall back, and a key added here would be a silent no-op. same keys, small
# values.
#
# CATBOOST TRAP, carried over from the h8 notes: 0 does NOT mean unlimited.
#   max_depth 0  -> build_model does `depth=... or 6` -> 6
#   max_leaves 0 -> the key is not forwarded at all   -> catboost's own default, 31
# both are written explicitly below so nothing is left to that fallback.

hyperparams_version: h8-fast      # tagged on every run, so a smoke test can never be mistaken
                                  # for a real one in the ClearML UI

random_forest:
  # not in MODEL_TYPES -- present only so the file has the same shape as the real one.
  default:
    n_estimators: 60
    max_depth: 8
    min_samples_leaf: 50
    max_features: "0.5"
    max_samples: 0.5
    seed: 42
  search:
    max_depth: [6, 8]
    min_samples_leaf: [50, 100]
    max_features: ["0.5", "0.8"]
    max_samples: [0.5, 0.8]
    n_estimators: [40, 60]

xgboost:
  default:
    grow_policy: "lossguide"     # same growth policy as h8 -- only the size changes
    max_leaves: 31               # h8: 0 (unlimited). CAPPED, or lossguide grows all night.
    n_estimators: 120            # h8: 6000
    max_depth: 6                 # h8: 0 (unlimited)
    max_bin: 128                 # h8: 256. coarser histogram = faster split scoring
    learning_rate: 0.3           # h8: 0.02. 120 trees cannot learn at 0.02
    subsample: 0.8
    colsample_bytree: 1.0
    colsample_bynode: 0.8        # h8: 0.5. less sampling noise, so a tiny model still fits
    max_delta_step: 1.0          # kept: the weighted rare-class guard is cheap
    # FLOATS ON PURPOSE -- merge() casts every override to the type of the default, and the
    # search rungs are decimals. an int default here makes int("0.3") fail and the trial dies.
    min_child_weight: 5.0
    reg_lambda: 1.0
    reg_alpha: 0.0
    gamma: 0.0
    seed: 42
    early_stopping_rounds: 15    # h8: 0 (off). ON here -- most smoke runs stop well under 120.
  search:
    learning_rate: [0.2, 0.3]
    n_estimators: [80, 120]
    max_leaves: [15, 31]
    subsample: [0.8, 1.0]
    colsample_bynode: [0.8, 1.0]
    max_delta_step: [0.0, 1.0]
    max_bin: [64, 128]
    min_child_weight: [5.0, 10.0]
    reg_lambda: [1.0, 5.0]
    reg_alpha: [0.0, 0.2]
    gamma: [0.0, 0.3]

catboost:
  default:
    n_estimators: 120            # h8: 6000
    max_depth: 6                 # h8: 16. explicit -- 0 would become 6 anyway, silently
    learning_rate: 0.3           # h8: 0.02
    l2_leaf_reg: 3.0
    min_data_in_leaf: 50
    rsm: 0.8
    colsample_bylevel: 0.8
    subsample: 0.8
    bootstrap_type: "MVS"
    random_strength: 1.0
    seed: 42
    grow_policy: "Lossguide"     # same policy as h8
    max_leaves: 31               # h8: 256. explicit -- 0 would silently drop to 31 anyway
    early_stopping_rounds: 15    # h8: 0 (off)
  search:
    max_leaves: [15, 31]
    max_depth: [4, 6]
    learning_rate: [0.2, 0.3]
    n_estimators: [80, 120]
    l2_leaf_reg: [3.0, 10.0]
    min_data_in_leaf: [50, 100]
    rsm: [0.8, 1.0]
    subsample: [0.8, 1.0]
    random_strength: [1.0, 0.0]
