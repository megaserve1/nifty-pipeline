# upload on the Build Dataset page, step 4 -> Save for catboost. catboost only.
# everything that granted capacity is turned down, and early stopping is finally on.
#
#                        yaml    this file
#   max_depth              16  ->    8      the real brake
#   l2_leaf_reg           5.0  -> 10.0      heavier damping on every leaf value
#   min_data_in_leaf       15  ->   50      no tiny leaves
#   rsm                   0.8  ->  0.6      column sampling back on
#   subsample             0.7  ->  0.6      row sampling back on
#   random_strength       3.0  ->  1.0      less split-scoring noise
#   early_stopping_rounds   0  ->  200      the important one
#
# early stopping was 0, and 0 means OFF -- every run built all 6000 iterations whatever the
# validation score did. measured on train_xgboost v7: best at round 240, saved at round 5997,
# 4.3% worse than its own best. with 200 here, n_estimators becomes a ceiling instead of a count.
#
# max_leaves 256 will NOT bind. measured on real v7 data, 25 trees each:
#     depth 8,  max_leaves 256    0.27 s/tree
#     depth 8,  max_leaves 65536  0.26 s/tree   identical -> 256 never binds
#     depth 16, max_leaves 256    0.49 s/tree   different -> depth was the limit
# at depth 8 catboost builds ~47-leaf trees whatever max_leaves says. that is a strong brake and
# probably what you want -- just know max_depth is doing the work, not max_leaves.
#
# not listed = keeps its yaml value: n_estimators 6000 (now a ceiling), bootstrap_type MVS, seed 42.

catboost:
  grow_policy: "Lossguide"
  max_leaves: 256
  max_depth: 8
  learning_rate: 0.02
  l2_leaf_reg: 10.0
  min_data_in_leaf: 50
  rsm: 0.6
  subsample: 0.6
  random_strength: 1.0
  early_stopping_rounds: 200
