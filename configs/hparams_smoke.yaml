# Upload this on the Build Dataset page, step 4 (Hyperparameters).
#
# WHAT IT IS FOR: proving the pipeline end to end in minutes -- build, publish, train, scored
# tables, OOS backtest, SHAP, deepchecks. It answers "does every hand fire", never "is this model
# any good". The model it produces will be poor. That is expected and is not a finding.
#
# TIMING, MEASURED ON THE REAL v7 DATA (640,742 train rows, 30 features, this machine):
#     xgboost  @ 31 leaves  1.00 s/tree  ->  200 trees ~ 3.3 min
#     catboost @ 31 leaves  1.73 s/tree  ->  200 trees ~ 5.8 min
# The two models train on separate agents at the same time, so expect ~6 minutes of wall-clock,
# plus a couple of minutes for the OOS scoring and backtest that follow.
#
# Anything not listed here falls through to configs/hyperparams.yaml (h8). That is the point of
# the overlay -- you only write down what you want to change.
#
# WHY THESE NUMBERS. h8 is 6000 trees at learning_rate 0.02 with early stopping OFF, so every run
# builds all 6000 trees: hours. This inverts that -- few trees, so each step has to be big, and
# capacity capped so a tree cannot grow all night:
#     n_estimators  6000 -> 200      a small count
#     learning_rate 0.02 -> 0.25     200 trees cannot learn anything at 0.02
#     max_leaves    uncapped -> 31   under lossguide THIS is the capacity knob
#     max_depth     uncapped -> 6
#     early stop    off -> 20        most runs will stop well before 200
#
# CATBOOST TRAP, from the h8 notes: 0 does NOT mean unlimited there. max_depth 0 silently becomes
# 6 and max_leaves 0 is dropped entirely (falls back to 31). Both are written out explicitly
# below so nothing depends on that fallback.

xgboost:
  n_estimators: 20
  learning_rate: 0.25
  max_leaves: 31
  max_depth: 6
  max_bin: 128            # coarser histogram = faster split scoring
  subsample: 0.8
  colsample_bynode: 0.8
  min_child_weight: 5.0
  reg_lambda: 1.0
  reg_alpha: 0.0
  gamma: 0.0
  early_stopping_rounds: 20

catboost:
  n_estimators: 20
  learning_rate: 0.25
  max_leaves: 31          # explicit: 0 would silently fall back to 31 anyway
  max_depth: 6            # explicit: 0 would silently become 6
  l2_leaf_reg: 3.0
  min_data_in_leaf: 50
  rsm: 0.8
  subsample: 0.8
  random_strength: 1.0
  early_stopping_rounds: 20
