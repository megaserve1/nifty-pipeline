# configs/hyperparams.yaml -- every model setting. no number lives in python.
#   train.py reads `default:`   hpo.py reads `search:`
#
# THREE TRAPS, ALL MEASURED, ALL STILL LIVE:
#
# 1. FLOATS NEED THE .0 . merge() casts every override to the TYPE of the default here. an int
#    default makes int("0.3") fail and the trial dies -- that killed the gamma=0.3 trials on
#    2026-07-22.
#
# 2. CATBOOST HAS NO "UNLIMITED". 0 does not mean uncapped there, it means smaller:
#       max_depth: 0   -> build_model does `depth = params["max_depth"] or 6`  -> DEPTH 6
#       max_leaves: 0  -> the key is not forwarded at all -> catboost's own default, 31 LEAVES
#    hard ceilings: depth 16, max_leaves 65536 under Lossguide. xgboost is the opposite -- there
#    0 genuinely IS unlimited for both.
#
# 3. YAML DOES NOT READ `None` AS NULL. `[10, 20, None]` gives the four-character STRING 'None',
#    which then dies in int(). use 0; build_model turns it into sklearn's None.
#
# CATBOOST GROWTH SATURATES AT ~360 LEAVES (measured, 25 trees per setting, depth read from
# catboost's own JSON export). below that, max_leaves rules and IS the capacity knob. above it,
# the depth wall takes over and max_leaves changes nothing -- 512, 1024 and 65536 all train the
# identical 360-leaf tree at up to 2x the wall-clock. so 256 is the top real rung, and depth is
# pinned at 16 to stay out of the way. lowering depth hands control back to the depth wall, which
# is depth-based growth wearing a Lossguide label.
#
# ONLY KEYS build_model() PASSES TO THE LIBRARY DO ANYTHING. a knob added here and not wired
# there used to be silently dropped -- colsample_bynode, max_delta_step and colsample_bylevel sat
# unwired from 2026-07-31 to 2026-08-05, searched by 50 HPO trials, never reaching the model.
# build_model now passes through anything the library accepts by name, and refuses to run if this
# file declares a knob the library has no name for.
#
# history of h2..h8 is in git; `hyperparams_version` below is only a handle -- the values-sha
# printed by every run is the real identity.

hyperparams_version: h8

xgboost:
  default:
    grow_policy: lossguide                    # LOSS-BASED: split whichever leaf cuts loss most
    # CAPPED AT 256, MATCHING CATBOOST. it was 0 (unlimited), and that is not just a modelling
    # choice -- it broke SHAP outright on v10. shap.TreeExplainer allocates EIGHT dense
    # (num_trees x max_nodes) arrays up front, and 7 classes x 6000 rounds = 42,000 trees. one
    # unlimited tree reached 14,069 nodes, so the allocation came to 54 GB and the step died.
    # 256 leaves -> at most 511 nodes -> about 2 GB, which fits.
    # it also stops a single tree memorising the training set at 6000 rounds.
    max_leaves: 128                           # under lossguide THIS is the capacity knob
    n_estimators: 5000
    max_depth: 0                              # 0 = unlimited; max_leaves is doing the capping
    max_bin: 256                              # histogram resolution. 128 coarser/faster, 512 more overfit room
    learning_rate: 0.02
    subsample: 1.0
    colsample_bytree: 1.0                     # off -- redundant with bynode (the model feels the product)
    colsample_bylevel: 0.6                    # feature subset re-dealt once per DEPTH
    colsample_bynode: 0.8                     # feature subset RE-DEALT at every split. the key regulariser
    max_delta_step: 0.0                       # off, by decision 2026-08-13
    # A FLOOR ON THE SUM OF WEIGHTS, NOT A ROW COUNT, and our weights span 550x. measured at the
    # softmax start (h = 2p(1-p) = 0.245 per row of weight 1), min_child_weight 100 needs:
    #     ENTRY_SUB  7 rows   EXIT_SUPER  102 rows   NO_TRADE  4,083 rows
    # so it bites NO_TRADE hardest -- which is where the over-trading is.
    min_child_weight: 100.0
    # MEASURED AGAINST THIS MODEL, NOT COPIED. on v7.3 the median LEAF cover is 196, so
    # reg_lambda 100 shrinks a typical leaf by 34%. at the old 5 it shrank it by 2% -- switched
    # on and doing nothing. (scripts/tree_scales.py prints these for any trained model.)
    reg_lambda: 100.0
    reg_alpha: 2.0                            # compared against |G|, median 42.7 -> zeroes ~3% of leaves
    # compared against GAIN, median 11.3. v7.3 ran gamma 2.0 and its LOWEST surviving gain was
    # 2.0016 -- the wall sat below the floor and rejected nothing. 1.0 is a deliberate low anchor
    # for the search; the range below is what actually gets tested.
    gamma: 1.0
    seed: 42
    early_stopping_rounds: 400                # was 0 = off. armed only when a val split exists
    tree_method: hist                         # xgboost's own default. listed so merge() accepts it
  # THE SEARCH SPACE, 2026-08-13. gamma carries an extra 10 beyond the agreed [0,1,3]: measured on
  # v7.3, gamma 0/1/2 cut 0.0% of splits and 3 cut 6.5%, so without a value that bites the sweep
  # would only confirm what we already ran. 10 cuts 45% -- that is the one that tells us something.
  search:
    learning_rate: [0.02, 0.03]
    subsample: [0.6, 0.8]
    reg_lambda: [20.0, 30.0, 50.0, 70.0]
    reg_alpha: [0.0, 3.0, 5.0]
    gamma: [0.0, 3.0, 10.0]
    max_leaves: [128, 256]
    min_child_weight: [50.0, 80.0, 150.0]

catboost:
  default:
    # NO colsample_bytree HERE. catboost has no such parameter -- rsm below IS that knob
    # (its alias is colsample_bylevel, not bytree). declaring it made every run refuse to start.
    n_estimators: 6000
    max_depth: 6                              # catboost's hard max. pinned so max_leaves decides the shape
    learning_rate: 0.02
    l2_leaf_reg: 5.0
    min_data_in_leaf: 15                      # honoured under Lossguide only. not what stops growth here
    #rsm: 0.7
    #subsample: 1.0                           # forwarded only because bootstrap_type is not Bayesian
    bootstrap_type: Bayesian
    # SPELLING FIXED 2026-08-21: written 'bagging_tempeature' in the supplied block. catboost has
    # no parameter by that name, so build_model would have refused. everything else is verbatim.
    bagging_temperature: 1
    random_strength: 1.0
    seed: 42
    grow_policy: Lossguide
    score_function: NewtonL2
    max_leaves: 256      # THE capacity knob. real rungs 64/128/256; >=360 does nothing
    # early_stopping_rounds: 0                # 0 = off, so all n_estimators are built
    max_bin: 128      # = border_count. bins per feature. catboost cpu default
    has_time: true
    feature_border_type: UniformAndQuantiles         # how those bins are chosen   #GreedyLogSum
    #langevin: true
    #diffusion_temperature: 40000
    leaf_estimation_method: Newton
    leaf_estimation_iterations: 2
    leaf_estimation_backtracking: Armijo
    # embargo_session BELONGS TO THE SPLIT, NOT THE MODEL -- it is config.EMBARGO_SESSIONS (25).
    # listing it here would hand catboost a parameter it does not have. left out by decision.
    task_type: 'GPU'   # ONLY the 'lossbased' queue has a GPU worker -- fire with --queue lossbased
  search:
    max_leaves: [31, 48, 64]
    max_depth: [5, 6, 7]
    learning_rate: [0.03, 0.04, 0.01, 0.06]
    n_estimators: [4000, 5000, 6000]
    max_bin: [128, 254]
    # reg_lambda is NOT a second knob -- it is catboost's alias for l2_leaf_reg, so searching both
    # hands catboost two names for one setting and it refuses. the wider range is folded in here.
    # reg_alpha is gone too: catboost has no L1 knob by that name, it is an xgboost parameter.
    l2_leaf_reg: [3.0, 5.0, 10.0, 15.0]
    min_data_in_leaf: [550, 1050, 1550]
    #subsample: [0.8, 1.0]
    random_strength: [1, 3]
