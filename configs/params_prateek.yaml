# prateek's set. upload on the Build Dataset page, step 4 -> Save for catboost.
# all 16 checked against catboost -- none ignored, fits clean.
#
#                        yaml      this file
#   max_depth              16  ->    15
#   l2_leaf_reg           5.0  ->  30.0      six times heavier damping on leaf values
#   min_data_in_leaf       15  ->    50      no tiny leaves
#   subsample             0.7  ->   1.0      row sampling OFF
#   early_stopping_rounds   0  ->   600      0 means OFF, so this is the big one
#   max_bin               254  ->   128      coarser bins -> fewer split points -> simpler trees
#   feature_border_type  Greedy -> UniformAndQuantiles
#   langevin            false  ->  true      gradient noise, an anti-overfit trick
#   diffusion_temperature 10000 -> 30000     how much noise. only does anything with langevin on
#
# FOUR OF THESE ONLY WORK AS OF TODAY. max_bin, feature_border_type, langevin and
# diffusion_temperature were not in configs/hyperparams.yaml, and merge() drops any knob that is
# not listed there -- silently. they have been added with catboost's own defaults, so the baseline
# is unchanged and these values now arrive.
#
# LANGEVIN IS LOWERCASE. 'Langevin' is not a catboost parameter and was being ignored, which also
# made diffusion_temperature dead weight since it does nothing on its own.
#
# REG_LAMBDA IS NOT HERE ON PURPOSE. catboost treats l2_leaf_reg and reg_lambda as ONE knob and
# refuses both -- same crash as rsm/colsample_bylevel this morning. the list had l2_leaf_reg 30.0
# AND reg_lambda 10.0, two different values for the same setting. taking 30.0 as the catboost
# intent; 10.0 looks like the xgboost value showing in the same UI list. CHANGE IT IF THAT IS WRONG.
#
# max_leaves 256 WILL bind at depth 15. at depth 8 it did not (catboost made ~47-leaf trees and
# depth ruled). measured on the real v7 data: train_catboost v7.1 ran depth 15 / max_leaves 512
# and its median tree had exactly 512 leaves -- pinned at the cap on every tree.
#
# not listed = keeps its yaml value: bootstrap_type MVS.

catboost:
  n_estimators: 6000
  max_depth: 15
  learning_rate: 0.02
  l2_leaf_reg: 30.0
  min_data_in_leaf: 30
  rsm: 0.6
  col_sample_bytree : 0.8   
  subsample: 1.0
  random_strength: 4.0
  seed: 42
  grow_policy: "Lossguide"
  max_leaves: 256
  early_stopping_rounds: 0
  border_count: 128
  feature_border_type: "UniformAndQuantiles"
  langevin: true
  diffusion_temperature: 30000.0

# XGBOOST
#
#                        current      this file
#   max_depth               8    ->     5
#   gamma                 0.3    ->   2.0     READ THE WARNING BELOW
#   min_child_weight       48    ->    50
#   colsample_bytree      0.6    ->   0.8
#   subsample             0.6    ->   0.8
#   reg_alpha             0.2    ->   0.5
#   max_delta_step        1.0    ->     3
#   max_bin               256    ->   128
#   early_stopping_rounds 200    ->     0     OFF. read the second warning
#   unchanged: n_estimators, learning_rate, reg_lambda, seed
#
# TREE_METHOD ONLY WORKS AS OF TODAY. it was not in configs/hyperparams.yaml, so merge() dropped
# it without a word. added there with xgboost's own default (hist), so this value now arrives.
#
# WARNING 1 -- GAMMA 2.0 MAKES STUMPS. gamma is the minimum gain a split must produce; below it
# xgboost refuses to split and returns the tree as a single leaf that does nothing. at 0.3 with
# early stopping on, train_xgboost v7 had ZERO stumps. measured on toy data at gamma 2.0: 19% of
# trees were single leaves after only 40 rounds. this morning's unbraked runs (gamma 0.3, early
# stopping OFF) were 54-57% stumps -- the median tree was one node.
#
# WARNING 2 -- EARLY_STOPPING_ROUNDS 0 MEANS OFF, not zero rounds. all 6000 trees get built no
# matter what validation does. that is the exact setting we fixed today: train_xgboost v7's best
# round was 260 and without it the model would have been saved 4.3% worse than its own best.
# gamma 2.0 AND no early stopping together is what produced the 54-57% stump models.
# prateek's catboost set uses 600 here. this is the one inconsistency between the two.
#
# NOT overridden, keeps its current value: grow_policy lossguide, max_leaves 256,
# colsample_bynode 0.5.

xgboost:
  n_estimators: 6000
  learning_rate: 0.02
  max_depth: 7
  min_child_weight: 50         # counts COVER (sum of sample_weight), NOT rows
  reg_lambda: 10.0
  reg_alpha: 0.5
  gamma: 2.0
  colsample_bytree: 0.8
  subsample: 0.8
  max_delta_step: 3
  tree_method: "hist"
  max_bin: 128
  seed: 42
  early_stopping_rounds: 0
