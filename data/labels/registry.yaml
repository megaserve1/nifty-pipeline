# data/labels/registry.yaml -- THE LABEL MENU.
#
# a person picks a label by its HANDLE (L1, L2, L3) and the note -- never the file name. a dataset
# version records the handle in its recipe (labels_name: L1), and build_dataset resolves
# data/labels/<handle>.{csv,parquet} and hashes it. the sha256 below is the REAL identity: it
# catches the exact file even if someone swaps one later.
#
# to add a label: drop data/labels/L<n>.csv, add an entry here, commit.
#
# 2026-08-01: rewritten for the three-file drop. the previous menu had ONE entry pointing at
# L1.parquet, which no longer exists -- any build naming it would have failed on a missing file.
# NOTE the classes differ between them: L1 and L2 are 7-class, L3 is 6-class. no `default:` is
# marked on purpose, so --labels must be given explicitly and a run can never pick one by accident.

L1:
  file: L1.csv
  # REPLACED 2026-08-08 -- the file changed under the same handle. same 1,021,847 rows, same span,
  # still 7 classes, but the rules were TIGHTENED: NO_TRADE 74.5% -> 87.0% and every trade class
  # roughly halved (ENTRY_SMALL 1.04% -> 0.17%, a sixth). versions v7, v7.3, v8 and v9 were built
  # on the OLD file (sha 2261cc74...) and mean something different from anything built from now on.
  # their manifests carry the old sha, so they stay distinguishable -- read labels_sha256, not the
  # handle. CLASS_WEIGHTS were tuned for the old shares; they were recomputed for these.
  note: "20-bar forward window, TIGHTENED 2026-08-08: NO_TRADE 87%, entries roughly halved vs the
    original L1. 7 classes. the baseline."
  rows: 1021847
  n_classes: 7
  span: ["2015-01-09 09:15:00", "2026-02-24 15:29:00"]
  # NO_TRADE carries real weight, not 0 -- a zero-weight class contributes nothing to the loss and
  # the model could never learn to stay out of the market.
  no_trade_weight: 0.0689
  class_share: {NO_TRADE: 0.8695, EXIT_SUPER: 0.0622, EXIT_SUB: 0.0358, ENTRY_SUPER: 0.0205, EXIT_SMALL: 0.0078, ENTRY_SUB: 0.0025, ENTRY_SMALL: 0.0017}
  sha256: "14d620a605eaf4fc3b72b500c5c89d5d982f6c86806fd7b14b5a70a42ef90671"
  # the file this replaced, so the old versions can still be traced by hash
  previous_sha256: "2261cc74765f60534b69f1aba86c76d551375bbf68c5b0c99b7d8e3a46383c0c"

L2:
  file: L2.csv
  # REPLACED 2026-08-19 -- regenerated on the same TIGHTENED basis L1 received on 08 Aug.
  # NO_TRADE 73.1% -> 86.6% and every trade class roughly halved. it remains the LOOSER-entry
  # twin of L1: ENTRY_SUPER 2.33% vs L1's 2.05%, ENTRY_SUB 0.29% vs 0.25%, ENTRY_SMALL 0.19%
  # vs 0.17%. exits are identical to L1, as before.
  # VERSIONS v7.1 AND v7.2 WERE BUILT ON THE OLD FILE (sha c601cf5f...) and mean something
  # different from anything built from now on. their manifests carry the old sha, so they stay
  # distinguishable -- read labels_sha256, never the handle.
  note: "same window as L1 but a LOOSER entry rule. TIGHTENED 2026-08-19 to match L1: NO_TRADE
    86.6%, entries roughly halved. exits identical to L1."
  rows: 1021847
  n_classes: 7
  span: ["2015-01-09 09:15:00", "2026-02-24 15:29:00"]
  # NO_TRADE carries real weight, not 0 -- a zero-weight class contributes nothing to the loss and
  # the model could never learn to stay out of the market.
  no_trade_weight: 0.0689
  class_share: {NO_TRADE: 0.8661, EXIT_SUPER: 0.0622, EXIT_SUB: 0.0358, ENTRY_SUPER: 0.0233, EXIT_SMALL: 0.0078, ENTRY_SUB: 0.0029, ENTRY_SMALL: 0.0019}
  sha256: "c4628ddbe060816ce870dfa452ed6469c384bac4b7c6f0ab3df8db7770d89ca7"
  # the file this replaced, so v7.1 and v7.2 can still be traced by hash
  previous_sha256: "c601cf5fe1440abd866a9ae76d02df651fc4031669191443ba1d395985042e1e"

L3:
  file: L3.csv
  # REPLACED 2026-08-19 -- same tightening as L1 and L2. NO_TRADE 74.5% -> 87.0%.
  # NOTHING was ever built on the old file, so there is no version to re-read.
  note: "SIX classes, NOT seven -- ENTRY_SMALL and EXIT_SMALL are merged into one SMALL class.
    everything else matches L1. TIGHTENED 2026-08-19: NO_TRADE 87.0%. the trainer's class count,
    CLASS_WEIGHTS and the severity file all change with this one, so do not mix it with L1/L2 runs."
  rows: 1021847
  n_classes: 6
  span: ["2015-01-09 09:15:00", "2026-02-24 15:29:00"]
  # NO_TRADE carries real weight, not 0 -- a zero-weight class contributes nothing to the loss and
  # the model could never learn to stay out of the market.
  no_trade_weight: 0.0689
  class_share: {NO_TRADE: 0.8695, EXIT_SUPER: 0.0622, EXIT_SUB: 0.0358, ENTRY_SUPER: 0.0205, SMALL: 0.0095, ENTRY_SUB: 0.0025}
  sha256: "c15e2c1829bb93a6f6311ce9f5ce795b81e6d2de45e2154f33916f96689b8435"
  previous_sha256: "cc53968ddcef79cfe9dfea62aa43dcd68ee5468251ea0a0fcd79b349fd615860"
